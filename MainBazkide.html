<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eibar/Ermua Gaztelekua</title>
    <link rel="icon" type="image/png" href="Images/Logo.png">
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header>
        <img src="Images/Logo.png" alt="Empresa Logo" height="40">
        <h1>Eibar/Ermua Gaztelekua</h1>
        
        <div class="header-controls">
            <a href="#" class="Btn" data-testua="login">👤</a>
            
            <button class="Btn" id="settingsToggleBtn" aria-label="Ajustes">⚙️</button>

            <div class="settings-dropdown" id="settingsDropdown">
                <div class="settings-group">
                    <p data-testua="langLabel">Hizkuntza</p>
                    <div class="lang-buttons">
                        <button onclick="changeLanguage('eu')">EU</button>
                        <button onclick="changeLanguage('es')">ES</button>
                        <button onclick="changeLanguage('en')">EN</button>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--dropdown-border); margin: 12px 0;">

                <div class="settings-group">
                    <p data-testua="appearanceLabel">Itxura</p>
                    <button class="Btn" style="width: 100%;" id="themeToggleBtn" data-testua="modeNight">🌙 Gau modua</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <h4 data-testua="welcome">Ongi etorri Eibar/Ermuako Gaztelekuaren web orrira, zer egin nahi duzu:</h4>
        
        <div class="nav-grid">
            <a href="EkintzakBazkide.html" class="card-btn">
                <img src="Images/Ekintzak.png" alt="Ekintzak">
                <span data-testua="cardEkintzak">Ekintzak</span>
            </a>

            <a href="MonitoreLogin.html" class="card-btn">
                <img src="Images/Monitoreak.png" alt="Monitoreak">
                <span data-testua="cardMonitoreak">Monitoreak</span>
            </a>

            <a href="UdalekuLogin.html" class="card-btn">
                <img src="Images/Udalekuak.png" alt="Udalekuak">
                <span data-testua="cardUdalekuak">Udalekuak</span>
            </a>
        </div>
    </main>

    <footer>
        <div class="footer-simple">
            <div class="footer-brand">
                <img src="Images/Logo.png" alt="Gaztelekua Logo">
                <p>© 2026 Eibar / Ermua Gaztelekua</p>
            </div>
        </div>
    </footer>

    <script>
        const translations = {
            eu: {
                login: "Saioa hasi",
                langLabel: "Hizkuntza",
                appearanceLabel: "Itxura",
                modeNight: "🌙 Gau modua",
                modeDay: "☀️ Egun modua",
                welcome: "Ongi etorri Eibar/Ermuako Gaztelekuaren web orrira, zer egin nahi duzu:",
                cardEkintzak: "Ekintzak",
                cardMonitoreak: "Monitoreak",
                cardUdalekuak: "Udalekuak"
            },
            es: {
                login: "Iniciar Sesión",
                langLabel: "Idioma",
                appearanceLabel: "Apariencia",
                modeNight: "🌙 Modo Noche",
                modeDay: "☀️ Modo Día",
                welcome: "Bienvenido/a a la web del Gazteleku de Eibar/Ermua, ¿qué quieres hacer?:",
                cardEkintzak: "Actividades",
                cardMonitoreak: "Monitores",
                cardUdalekuak: "Campamentos"
            },
            en: {
                login: "Log In",
                langLabel: "Language",
                appearanceLabel: "Appearance",
                modeNight: "🌙 Night Mode",
                modeDay: "☀️ Day Mode",
                welcome: "Welcome to the Eibar/Ermua Gazteleku website, what would you like to do?:",
                cardEkintzak: "Activities",
                cardMonitoreak: "Monitors",
                cardUdalekuak: "Camps"
            }
        };

        const settingsToggleBtn = document.getElementById('settingsToggleBtn');
        const settingsDropdown = document.getElementById('settingsDropdown');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        settingsToggleBtn.addEventListener('click', () => {
            settingsDropdown.classList.toggle('active');
        });

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            const currentLang = document.documentElement.lang || 'eu';
            
            themeToggleBtn.textContent = isDark 
                ? translations[currentLang].modeDay 
                : translations[currentLang].modeNight;
        });

        function changeLanguage(lang) {
            if (!translations[lang]) return;

            document.documentElement.lang = lang;

            document.querySelectorAll('[data-testua]').forEach(element => {
                const key = element.getAttribute('data-testua');
                
                if (translations[lang][key]) {
                    if (key === 'modeNight') {
                        const isDark = document.body.classList.contains('dark-theme');
                        element.textContent = isDark ? translations[lang].modeDay : translations[lang].modeNight;
                    } else {
                        element.textContent = translations[lang][key];
                    }
                }
            });
        }
    </script>
</body>
</html>
